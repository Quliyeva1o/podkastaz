# Production stack on the Hetzner VPS. Secrets live in .env (not committed).
#
# Deploy / update (order matters — the build reads the database):
#   docker compose up -d db
#   docker compose run --rm tools                          # migrations
#   docker compose run --rm tools npm run db:seed-content  # first deploy only
#   docker compose run --rm tools npm run db:seed-admin    # first deploy only
#   docker compose build app && docker compose up -d
services:
  app:
    build:
      context: .
      target: runner
      # Host network so the build can reach Postgres on 127.0.0.1 to prerender pages.
      network: host
      args:
        SITE_URL: "https://${DOMAIN}"
        TURNSTILE_SITE_KEY: "${TURNSTILE_SITE_KEY:-}"
        DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB}"
    restart: unless-stopped
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - uploads:/app/uploads
      - next-cache:/app/.next/cache

  tools:
    build: { context: ., target: tools }
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    profiles: [tools]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Loopback only — reachable from the host (for the build), never from the internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      REDIRECT_DOMAINS: ${REDIRECT_DOMAINS:-}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app]

volumes:
  pgdata:
  uploads:
  next-cache:
  caddy-data:
  caddy-config:
